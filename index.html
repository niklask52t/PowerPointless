<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerPointless — Halt eine Präsentation, du Feigling</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <h1 class="logo">Power<span class="strike">Point</span><span class="accent">less</span></h1>
      <p class="tagline">Klick. Steh auf. Präsentiere. Keine Ausreden.</p>
      <button id="generate-btn" class="big-btn">Generate Presentation</button>
      <p class="hint">Tipp: Die Person rechts vom Klicker präsentiert. Pfeile = Slides wechseln.</p>
    </section>

    <section id="presentation" class="screen">
      <header class="slide-header">
        <span id="slide-counter" class="counter"></span>
        <button id="exit-btn" class="ghost-btn" title="Zurück">×</button>
      </header>
      <article id="slide" class="slide">
        <h2 id="slide-heading"></h2>
        <ul id="slide-bullets"></ul>
      </article>
      <footer class="slide-footer">
        <button id="prev-btn" class="nav-btn">← Zurück</button>
        <button id="next-btn" class="nav-btn primary">Weiter →</button>
      </footer>
    </section>

    <section id="end" class="screen">
      <h2>Applaus, Applaus.</h2>
      <p id="end-line"></p>
      <button id="again-btn" class="big-btn">Nächstes Opfer</button>
    </section>
  </main>

  <script src="presentations.js"></script>
  <script src="game.js"></script>
</body>
</html>
